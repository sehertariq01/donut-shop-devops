# MySQL ClusterIP Service - internal database access for app pods
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: default
  labels:
    app: donut-mysql
    component: database
spec:
  type: ClusterIP
  selector:
    app: donut-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
