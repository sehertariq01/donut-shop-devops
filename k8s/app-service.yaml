# Donut Shop Application NodePort Service - external access
apiVersion: v1
kind: Service
metadata:
  name: donut-app-service
  namespace: default
  labels:
    app: donut-shop
    component: frontend
spec:
  type: NodePort
  selector:
    app: donut-shop
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
