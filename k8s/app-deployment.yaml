# Donut Shop Application Deployment - 2 replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donut-app-deployment
  namespace: default
  labels:
    app: donut-shop
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donut-shop
  template:
    metadata:
      labels:
        app: donut-shop
        component: frontend
    spec:
      containers:
        - name: donut-app
          # Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username
          image: sehar123/donut-shop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: HOST
              value: mysql-service
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: DATABASE
              value: donutdb
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      # Wait for MySQL to be ready before starting app pods
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-service 3306; do
                echo "Waiting for MySQL..."
                sleep 5
              done
              echo "MySQL is ready"
