# Prometheus configuration for Donut Shop Management System
# Compatible with Prometheus and Grafana dashboards
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: donut-shop
    environment: production

# Alertmanager configuration (optional - uncomment when Alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

rule_files:
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  # Donut Shop application pods (via Kubernetes service discovery or static target)
  - job_name: donut-shop-app
    metrics_path: /
    static_configs:
      - targets:
          - donut-app-service:80
        labels:
          app: donut-shop
          component: frontend
    # For Kubernetes pod discovery, use this instead of static_configs:
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - default
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     regex: donut-shop
    #     action: keep

  # MySQL exporter (deploy mysql-exporter sidecar or standalone for metrics)
  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104
        labels:
          app: donut-mysql
          component: database
    # Note: Requires prometheus/mysqld-exporter deployment

  # Node exporter for host metrics (optional)
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  # Jenkins metrics (when prometheus plugin is installed)
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets:
          - jenkins:8080
        labels:
          service: jenkins
